name: Build and Push Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'docker/**'
      - 'igver/**'
      - 'setup.py'
      - '.github/workflows/docker-publish.yml'
  release:
    types: [published]
  workflow_dispatch:  # allow manual trigger

env:
  DOCKERHUB_REPO: sahuno/igver

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from setup.py
        id: version
        run: |
          VERSION=$(python3 -c "import re; print(re.search(r\"version='([^']+)'\", open('setup.py').read()).group(1))")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Generate Docker tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_REPO }}
          tags: |
            # always tag as latest on main branch push
            type=raw,value=latest,enable={{is_default_branch}}
            # version from setup.py on main branch push
            type=raw,value=${{ steps.version.outputs.version }},enable={{is_default_branch}}
            # use release tag name (e.g. v2.19.5 -> 2.19.5)
            type=semver,pattern={{version}}
            # short SHA for traceability
            type=sha,prefix=

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            CACHE_BUST=${{ github.sha }}
