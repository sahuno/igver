# igver IGV preferences template.
# igver copies this file into a fresh, run-scoped IGV directory (--igvDirectory) as prefs.properties,
# so a user's personal ~/igv (prefs, cached genome JSONs, logs) never changes a screenshot.
# igver then appends DEFAULT_GENOME_KEY=<the -g genome> and any --igv-prefs lines; later lines win.

# IGV window size. The snapshot width equals the window width; 1150x800 was the de-facto size of
# lab figures made before 1.3.0 (it came from a personal ~/igv/prefs.properties).
IGV.Bounds=0,0,1150,800

# No batch port: parallel IGV processes (-j) would otherwise all try to bind port 60151.
PORT_ENABLED=false

# IGV's own default, stated explicitly: a personal ~/igv used to switch it off.
SAM.DOWNSAMPLE_READS=true

# IGV's own default, stated explicitly: a personal ~/igv used to switch it on.
SAM.SHOW_SOFT_CLIPPED=false
